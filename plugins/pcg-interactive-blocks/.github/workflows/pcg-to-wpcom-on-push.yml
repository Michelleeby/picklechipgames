name: Build and Deploy to WordPress.com

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Define permissions for the workflow
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

jobs:
  php-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, curl, intl, json, mysql
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: |
          composer install --prefer-dist --no-progress

      - name: Install WordPress Coding Standards
        run: |
          composer require --dev wp-coding-standards/wpcs
          vendor/bin/phpcs --config-set installed_paths vendor/wp-coding-standards/wpcs

      - name: Run PHP_CodeSniffer
        run: |
          vendor/bin/phpcs --standard=WordPress --extensions=php --ignore=vendor/ .

      - name: Run PHPUnit tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress/
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root localhost latest
          vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

  code-quality:
    needs: php-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'plugins/pcg-interactive-blocks/package-lock.json'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            plugins/pcg-interactive-blocks/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('plugins/pcg-interactive-blocks/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          cd plugins/pcg-interactive-blocks
          npm ci

      - name: Run linting
        run: |
          cd plugins/pcg-interactive-blocks
          npm run lint:js
          npm run lint:css

      - name: Run code formatting check
        run: |
          cd plugins/pcg-interactive-blocks
          npm run format

      - name: Run security audit
        run: |
          cd plugins/pcg-interactive-blocks
          npm audit

      - name: Run dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  build:
    needs: code-quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'plugins/pcg-interactive-blocks/package-lock.json'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            plugins/pcg-interactive-blocks/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('plugins/pcg-interactive-blocks/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          cd plugins/pcg-interactive-blocks
          npm ci

      - name: Build plugin
        run: |
          cd plugins/pcg-interactive-blocks
          npm run build

      - name: Create plugin zip
        run: |
          cd plugins/pcg-interactive-blocks
          npm run plugin-zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: plugins/pcg-interactive-blocks/*.zip
          retention-days: 5

      # Note: You'll need to add WordPress.com deployment steps here
      # This requires setting up WordPress.com GitHub Deployments
      # and adding the necessary secrets to your repository